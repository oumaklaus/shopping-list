services:
  mongodb:
    image: mongo:7.0
    container_name: shopping-list-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongodb_data:
    name: shopping_list_mongo_data
