name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package backend
        run: ./backend/gradlew -p backend test shadowJar --no-daemon --console=plain

  android:
    name: Android tests, lint, and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and assemble
        run: ./android/gradlew -p android testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain
      - name: Verify launcher and backup policy
        run: |
          tests/run-sh-launch-test.sh
          tests/android-backup-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shopping-list-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
